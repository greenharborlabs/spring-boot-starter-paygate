name: Snapshot

on:
  workflow_dispatch:
    inputs:
      confirm_publish:
        description: 'Confirm that this reviewed main-branch commit should be published as a snapshot'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  snapshot:
    if: github.event.inputs.confirm_publish == 'true'
    runs-on: ubuntu-latest
    environment: maven-snapshots

    steps:
      - name: Checkout reviewed commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Snapshot publication must run from a commit already on main"
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Check snapshot version
        run: |
          VERSION=$(grep -oP '^version=\K.*' gradle.properties || echo "")
          if [[ ! "$VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Version '$VERSION' is not a SNAPSHOT version"
            exit 1
          fi
          echo "Publishing snapshot version: $VERSION"

      - name: Verify release readiness
        run: ./gradlew releaseReadiness -Pintegration

      - name: Verify publishing secrets
        run: |
          missing=()
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_SIGNING_KEY GPG_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required publishing secret: %s\n' "${missing[@]}"
            exit 1
          fi
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Publish snapshot
        run: ./gradlew publishToSonatype
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
