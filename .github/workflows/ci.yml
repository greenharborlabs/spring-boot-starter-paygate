name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GRADLE_OPTS: "--enable-native-access=ALL-UNNAMED"

jobs:
  agents-md-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate AGENTS.md commands
        run: ./scripts/validate-agents-md.sh

  large-file-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Detect large files and long production sources
        run: |
          exit_code=0

          while IFS= read -r -d '' file; do
            case "$file" in
              */src/test/*|*/src/integrationTest/*|*/src/securityTest/*)
                continue
                ;;
            esac
            size=$(wc -c < "$file")
            if [ "$size" -gt 512000 ]; then
              echo "::error file=${file}::File exceeds 500KB limit ($(( size / 1024 ))KB): ${file}"
              exit_code=1
            fi
          done < <(git ls-files -z)

          while IFS= read -r -d '' file; do
            case "$file" in
              gradle/verification-metadata.xml|*/src/test/*|*/src/integrationTest/*|*/src/securityTest/*)
                continue
                ;;
            esac
            case "$file" in
              *.java|*.kt|*.kts|*.xml|*.yml|*.yaml|*.properties|*.json|*.gradle)
                lines=$(wc -l < "$file")
                if [ "$lines" -gt 1000 ]; then
                  echo "::error file=${file}::Source file exceeds 1000-line limit (${lines} lines): ${file}"
                  exit_code=1
                fi
                ;;
            esac
          done < <(git ls-files -z)

          exit "$exit_code"

  formatting:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check formatting without changing sources
        run: ./gradlew spotlessCheck

  build-and-test:
    needs: [agents-md-validation, large-file-detection, formatting]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build, test, and verify coverage
        run: ./gradlew build

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 14

  dependency-health:
    needs: [agents-md-validation, large-file-detection, formatting]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Verify disposition, example, and dependency-health gates
        run: ./gradlew validateAddressSecurityFindingDispositions validateDependencyCheckRiskDispositions verifyExampleArtifactSafety buildHealth

  integration-test:
    needs: [agents-md-validation, large-file-detection, formatting]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23'
          cache-dependency-path: paygate-integration-tests/go-interop/go.sum

      - name: Download and verify locked Go dependencies
        working-directory: paygate-integration-tests/go-interop
        run: |
          go mod download all
          go mod verify
          git diff --exit-code -- go.mod go.sum

      - name: Run integration tests
        run: ./gradlew :paygate-integration-tests:test :paygate-integration-tests:securityTest -Pintegration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: |
            paygate-integration-tests/build/test-results/test/*.xml
            paygate-integration-tests/build/test-results/securityTest/*.xml
          retention-days: 14

  pr-gate:
    name: pr-gate
    if: always()
    needs:
      - agents-md-validation
      - large-file-detection
      - formatting
      - build-and-test
      - dependency-health
      - integration-test
    runs-on: ubuntu-latest

    steps:
      - name: Require every deterministic CI job
        env:
          AGENTS_RESULT: ${{ needs.agents-md-validation.result }}
          LARGE_FILE_RESULT: ${{ needs.large-file-detection.result }}
          FORMATTING_RESULT: ${{ needs.formatting.result }}
          BUILD_RESULT: ${{ needs.build-and-test.result }}
          DEPENDENCY_HEALTH_RESULT: ${{ needs.dependency-health.result }}
          INTEGRATION_RESULT: ${{ needs.integration-test.result }}
        run: |
          for result in \
            "$AGENTS_RESULT" \
            "$LARGE_FILE_RESULT" \
            "$FORMATTING_RESULT" \
            "$BUILD_RESULT" \
            "$DEPENDENCY_HEALTH_RESULT" \
            "$INTEGRATION_RESULT"; do
            if [ "$result" != success ]; then
              echo "::error::Required CI job did not succeed: $result"
              exit 1
            fi
          done

  javadoc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pr-gate
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate aggregate Javadoc
        run: ./gradlew aggregateJavadoc

      - name: Upload Javadoc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: javadoc
          path: build/docs/javadoc/
          retention-days: 30
