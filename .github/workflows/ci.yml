name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

env:
  GRADLE_OPTS: "--enable-native-access=ALL-UNNAMED"

jobs:
  agents-md-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Validate AGENTS.md commands
        run: ./scripts/validate-agents-md.sh

  large-file-detection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Detect large files (>500KB) and long source files (>1000 lines)
        run: |
          EXIT_CODE=0

          echo "=== Checking for files larger than 500KB ==="
          while IFS= read -r -d '' file; do
            case "$file" in
              */src/test/*|*/src/integrationTest/*|*/src/securityTest/*)
                continue
                ;;
            esac
            size=$(wc -c < "$file")
            if [ "$size" -gt 512000 ]; then
              echo "::error file=${file}::File exceeds 500KB limit ($(( size / 1024 ))KB): ${file}"
              EXIT_CODE=1
            fi
          done < <(git ls-files -z)

          echo ""
          echo "=== Checking for source files exceeding 1000 lines ==="
          while IFS= read -r -d '' file; do
            case "$file" in
              */src/test/*|*/src/integrationTest/*|*/src/securityTest/*)
                continue
                ;;
            esac
            case "$file" in
              *.java|*.kt|*.kts|*.xml|*.yml|*.yaml|*.properties|*.json|*.gradle|*.gradle.kts)
                lines=$(wc -l < "$file")
                if [ "$lines" -gt 1000 ]; then
                  echo "::error file=${file}::Source file exceeds 1000-line limit (${lines} lines): ${file}"
                  EXIT_CODE=1
                fi
                ;;
            esac
          done < <(git ls-files -z)

          if [ "$EXIT_CODE" -eq 0 ]; then
            echo "All files within size limits."
          fi
          exit $EXIT_CODE

  build:
    needs: [agents-md-validation, large-file-detection]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Build
        run: ./gradlew build

      - name: Verify security disposition and example safety gates
        run: ./gradlew validateAddressSecurityFindingDispositions validateDependencyCheckRiskDispositions verifyExampleArtifactSafety verifySupplyChainNegativeControls

      - name: Detect unused dependencies
        run: ./gradlew buildHealth

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: '**/build/test-results/test/*.xml'
          retention-days: 14

      - name: Upload JaCoCo reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: jacoco-reports
          path: '**/build/reports/jacoco/**'
          retention-days: 14

      - name: JaCoCo coverage summary
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@e51ce1f46f7f8b5331593f935e59cbaf44b84920 # v1.8.0
        with:
          paths: '**/build/reports/jacoco/test/jacocoTestReport.xml'
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 60
          min-coverage-changed-files: 80
          title: Coverage Report
          update-comment: true

      - name: Publish test results
        if: github.event_name == 'pull_request' && always()
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        with:
          name: Test Results
          path: '**/build/test-results/test/*.xml'
          reporter: java-junit

  javadoc:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Generate aggregate Javadoc
        run: ./gradlew aggregateJavadoc

      - name: Upload Javadoc
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: javadoc
          path: build/docs/javadoc/
          retention-days: 30

  integration-test:
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.23'
          cache-dependency-path: paygate-integration-tests/go-interop/go.sum

      - name: Prepare Go dependencies
        run: cd paygate-integration-tests/go-interop && go mod tidy

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Run integration tests
        run: ./gradlew :paygate-integration-tests:test -Pintegration

      - name: Upload integration test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: integration-test-results
          path: 'paygate-integration-tests/build/test-results/test/*.xml'
          retention-days: 14
