name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify release evidence
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags must point to commits already on main"
            exit 1
          fi

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Cache Gradle
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', '**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Verify release version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          GRADLE_VERSION=$(grep -oP '^version=\K.*' gradle.properties)
          if [ "$TAG_VERSION" != "$GRADLE_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match gradle.properties version ($GRADLE_VERSION)"
            exit 1
          fi
          if [[ "$GRADLE_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Cannot release a SNAPSHOT version"
            exit 1
          fi

      - name: Run release readiness gate
        run: ./gradlew releaseReadiness -Pintegration

      - name: Generate SBOMs
        run: ./gradlew cyclonedxBom

      - name: Collect immutable release evidence
        run: |
          mkdir -p build/release-evidence/sbom build/release-evidence/artifacts
          find . -path '*/build/reports/bom.json' -exec sh -c '
            module=$(echo "$1" | sed "s|^\./||;s|/build/reports/bom.json||")
            cp "$1" "build/release-evidence/sbom/${module}-sbom.json"
          ' _ {} \;
          find . -type f -path '*/build/libs/*.jar' -print0 | while IFS= read -r -d '' artifact; do
            destination="build/release-evidence/artifacts/${artifact#./}"
            mkdir -p "$(dirname "$destination")"
            cp "$artifact" "$destination"
          done
          (
            cd build/release-evidence/artifacts
            find . -type f -name '*.jar' -print0 | LC_ALL=C sort -z | xargs -0 sha256sum
          ) > build/release-evidence/SHA256SUMS
          test -s build/release-evidence/SHA256SUMS
          find build/release-evidence/sbom -type f -name '*-sbom.json' -print -quit | grep -q .

      - name: Upload release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence
          path: build/release-evidence
          if-no-files-found: error

      - name: Attest release evidence
        uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: build/release-evidence/**

  publish-maven-central:
    name: Publish to Maven Central
    needs: verify-release
    runs-on: ubuntu-latest
    environment: maven-central
    permissions:
      contents: write

    steps:
      - name: Checkout verified tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}

      - name: Setup Java 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Download attested release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-evidence
          path: build/release-evidence

      - name: Verify release evidence manifest
        run: |
          test -s build/release-evidence/SHA256SUMS
          find build/release-evidence/sbom -type f -name '*-sbom.json' -print -quit | grep -q .
          (
            cd build/release-evidence/artifacts
            sha256sum --check ../SHA256SUMS
          )

      - name: Restore verified publication artifacts
        run: cp -a build/release-evidence/artifacts/. .

      - name: Verify publishing secrets
        run: |
          missing=()
          for name in SONATYPE_USERNAME SONATYPE_PASSWORD GPG_SIGNING_KEY GPG_SIGNING_PASSWORD; do
            if [ -z "${!name}" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing required publishing secret: %s\n' "${missing[@]}"
            exit 1
          fi
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Sign and publish to Sonatype, then release to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository -x jar -x sourcesJar -x javadocJar
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          generate_release_notes: true
          files: build/release-evidence/sbom/*-sbom.json
