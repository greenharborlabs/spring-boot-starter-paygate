version: 2

updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: main
    open-pull-requests-limit: 5
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # gRPC follows Spring Boot's managed version; Boot upgrades carry it
      # (keel/2026-11-01-upgrade-gradle-minor-and-patch-dependencies.md).
      - dependency-name: "io.grpc:*"
      # The Plugin Portal copy of 0.10.1 fails its publisher signature; later
      # releases are still proposed
      # (keel/2026-11-15-land-gradle-dependency-updates-105-104.md).
      - dependency-name: "com.google.protobuf"
        versions: ["0.10.1"]
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Dependabot updates SHA-pinned `uses:` references in place; workflow refs stay immutable.
    commit-message:
      prefix: "chore(actions)"
      include: scope
    target-branch: main
    open-pull-requests-limit: 3
    groups:
      github-actions-minor-and-patch:
        update-types:
          - minor
          - patch
    labels:
      - dependencies
      - github-actions
